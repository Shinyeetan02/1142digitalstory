<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1142數位圖像敘事與創作</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- main -->
    <div class="scene1-container">
        <video id="scene1" src="videos/scene1.mp4" preload="auto" muted playsinline></video>
        <div class="title">失眠 不焦慮</div>
        <button id="playBtn">進入故事</button>
    </div>
    <div class="scene2-container">
        <video id="scene2" src="videos/scene2.mp4" preload="auto" muted playsinline></video>
        <img id="hintScrolling-img" src="images/hintScrolling.png">
    </div>
    <div class="scene3-container">
        <video id="scene3" src="videos/scene3.mp4" preload="auto" muted playsinline></video>
        <img id="scene3-img" src="images/scene3-3.png">
        <img id="hintClick-img" src="images/hintClick.png">
        <button id="phoneBtn"></button>
    </div>
    <div class="scene4-container">
        <video id="scene4" src="videos/scene4.mp4" preload="auto" muted playsinline></video>
    </div>
    <div class="scene5-container">
        <video id="scene5" src="videos/scene5.mp4" preload="auto" muted playsinline></video>

        <img id="mindbubble1" src="images/mind bubbles1.png">
        <img id="mindbubble2" src="images/mind bubbles2.png">
        <img id="mindbubble3" src="images/mind bubbles3.png">
        <img id="mindbubble4" src="images/mind bubbles4.png">
        <img id="mindbubble5" src="images/mind bubbles5.png">
        <img id="mindbubble6" src="images/mind bubbles6.png">

        <audio id="lofi" src="musics/Lofi-music.MP3"></audio>
        <audio id="classical" src="musics/Classical-music.MP3"></audio>
        <audio id="scene1bgm" src="musics/scene1BackgroundMusic.MP3"></audio>
        <audio id="scene2bgm" src="musics/scene2BackgroundSoundEffect.MP3" loop></audio>
        <audio id="scene5bgm" src="musics/scene5BackgroundMusic.MP3" loop></audio>
    </div>
    <img id="hintClick-img-scene5" src="images/mindBubbleHint.png">

    <div class="scene6-container">
        <img id="scene6-img" src="images/scene6-img.png">
        <video id="scene6" src="videos/scene6.mp4" preload="auto" muted playsinline></video>
        <img id="hintClick-img-scene6" src="images/hintClick.png">
    </div>

    <div class="scene8-container">
        <video id="scene8" src="videos/scene8.mp4" preload="auto" muted playsinline></video>
    </div>

    <div class="scene9-container">
        <video id="scene9" src="videos/scene9.mp4" preload="auto" muted playsinline></video>
        <img id="hintClick-img-scene9" src="images/hintClick.png">
    </div>

    <div id="relaxOptions">
        <p id="caption_relax1">看來小兔真的很不安！</p>
        <p id="caption_relax2">要選擇什麼幫助他放鬆呢？</p>
        <div class="relax-images">
            <div class="relax-item">
                <img id="tea" src="images/lavenderTea.png">
                <span class="relax-label">喝一杯薰衣草花茶</span>
            </div>
            <div class="relax-item">
                <img id="oil" src="images/lavenderEssentialOil.png">
                <span class="relax-label">嗅一嗅薰衣草精油</span>
            </div>
        </div>
    </div>

    <!-- music -->
    <div id="music-overlay">
        <p id="music-prompt">再放個音樂協助小兔穩定情緒吧～<br/>選什麼音樂好呢？</p>
        <div id="music-buttons">
            <button id="lofiBtn" class="music-btn">Lofi音樂</button>
            <button id="classicalBtn" class="music-btn">古典樂</button>
        </div>
    </div>

    <!-- captions -->
    <div class="captions">
        <p id="caption1">一隻綿羊...</p>
        <p id="caption2">兩隻綿羊...</p>
        <p id="caption3">三隻綿羊...</p>
        <p id="caption4">這裡怎麼會有個大洞口？</p>
    </div>
    <div class="hints">
        <p id="hintScrolling">請滾動滑鼠</p>
        <p id="hintClick">點擊安撫小兔的焦慮想法</p>
    </div>
    <div class="scene3-captions">
        <p id="caption5">看來小兔還是睡不著</p>
        <p id="caption6">好奇現在幾點了</p>
        <p id="caption7">打開手機看看吧～</p>
    </div>
    <div class="scene6-captions">
        <p id="caption7.5">點擊撥開雲霧</p>
    </div>
    <div class="scene9-captions">
        <p id="caption8">你知道嗎<br/>全世界有超過20億人和你一樣，在深夜裡守候黎明</p>
        <p id="caption9">你並不孤單</p>
        <p id="caption10">別去追趕睡眠<br/>接納那個焦慮的、疲憊的、真實的自己</p>
        <p id="caption11">祝你 晚安</p>
        <img id="theEnd" src="images/The end.png">
    </div>

    <!-- 载入 GSAP 库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollToPlugin.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="gsap.js"></script>

    <!-- 手機尺寸提示 -->
    <div id="mobile-notice" style="
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: #fff;
        color: #222222;
        font-size: 20px;
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
        justify-content: center;
        align-items: center;
        padding: 40px;
        box-sizing: border-box;
        z-index: 9999;
        line-height: 1.8;
    ">
        抱歉!本專案尚未進行 RWD 設計<br>請使用電腦進行體驗
    </div>
    <script>
        function checkMobile() {
            const notice = document.getElementById('mobile-notice')
            if (window.innerWidth < 768) {
                notice.style.display = 'flex'
                document.body.style.overflow = 'hidden'
            } else {
                notice.style.display = 'none'
            }
        }
        checkMobile()
        window.addEventListener('resize', checkMobile)
    </script>
</body>
</html>
